name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build GooseOverlay
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Test whisper state and leader portraits
        shell: pwsh
        run: ./test.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GooseOverlay
          path: dist/GooseOverlay.ts3_plugin
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/GooseOverlay.ts3_plugin --title "GooseOverlay ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
